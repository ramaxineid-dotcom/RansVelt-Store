<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - RansVelt</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(135deg,#a5b4fc 0%,#c4b5fd 35%,#fbcfe8 70%,#bae6fd 100%);background-attachment:fixed;display:flex;min-height:100vh}
body::before{content:'';position:fixed;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.6),transparent);border-radius:50%;pointer-events:none}
h1,h2,h3{font-family:'Syne',sans-serif}
button{cursor:pointer;transition:.25s}
button:active{transform:scale(.97)}
.icon{width:20px;height:20px;flex-shrink:0}
.icon-sm{width:16px;height:16px}
.sidebar{width:272px;background:rgba(255,255,255,.18);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-right:1px solid rgba(255,255,255,.45);border-radius:0 28px 28px 0;padding:22px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50;box-shadow:20px 0 40px rgba(0,0,0,.06)}
.logo{font-size:26px;font-weight:800;color:#111827}
.logo span{color:#7c3aed}
.sidebar p{font-size:12px;color:#4b5563;margin-top:4px}
.nav{margin-top:26px;display:flex;flex-direction:column;gap:8px}
.nav button{width:100%;text-align:left;padding:13px 14px;border:1px solid transparent;border-radius:16px;background:rgba(255,255,255,.25);color:#1f2937;font-weight:600;display:flex;gap:12px;align-items:center;backdrop-filter:blur(10px)}
.nav button.active{background:rgba(124,58,237,.9);color:#fff;box-shadow:0 8px 24px rgba(124,58,237,.35);border-color:rgba(255,255,255,.4)}
.nav button .badge{margin-left:auto;background:#ef4444;color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.side-foot{margin-top:auto;background:rgba(255,255,255,.35);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);padding:16px;border-radius:20px;font-size:13px;color:#1f2937;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.main{flex:1;margin-left:272px;padding:22px;max-width:1000px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.35);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.55);padding:16px 20px;border-radius:22px;box-shadow:0 8px 32px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.6)}
.glass{background:rgba(255,255,255,.35);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.55);border-radius:22px;padding:18px;box-shadow:0 8px 32px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.6)}
input,select{width:100%;padding:12px;border:1px solid rgba(255,255,255,.6);border-radius:14px;margin:6px 0;background:rgba(255,255,255,.6);backdrop-filter:blur(10px)}
.btn{width:100%;padding:12px;border:0;border-radius:999px;background:#7c3aed;color:#fff;font-weight:700;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-green{background:#16a34a}.btn-red{background:#dc2626}.btn-blue{background:#2563eb}.btn-ghost{background:rgba(255,255,255,.6);color:#111}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.stat-grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-top:14px}
.order-card{background:rgba(255,255,255,.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:14px;margin-bottom:12px}
.setoran-row{background:rgba(255,255,255,.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.history-day{background:rgba(255,255,255,.55);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:14px;margin-bottom:12px}
.history-day.active-day{border:2px solid #7c3aed}
.bar-bg{height:10px;background:rgba(255,255,255,.6);border-radius:999px;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#ec4899);border-radius:999px}
.status{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.Pending{background:#fef9c3;color:#854d0e}.Proses{background:#dbeafe;color:#1e40af}.Selesai{background:#dcfce7;color:#166534}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.9);backdrop-filter:blur(10px);color:#fff;padding:12px 20px;border-radius:14px;display:none;z-index:200}
.hamburger{display:none}
@media(max-width:768px){
.sidebar{transform:translateX(-100%);transition:.3s;width:280px;border-radius:0 28px 28px 0}
.sidebar.show{transform:translateX(0)}
.main{margin-left:0;padding:12px}
.hamburger{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.4);backdrop-filter:blur(10px);color:#111;font-size:20px}
.stat-grid,.stat-grid-4{grid-template-columns:1fr 1fr}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);z-index:40;display:none}
.overlay.show{display:block}
}
</style>
</head>
<body>
<div id="toast"></div>
<div class="overlay" id="overlay" onclick="toggleSide(false)"></div>
<aside class="sidebar" id="sidebar">
<div class="logo">Rans<span>Velt</span></div>
<p>Admin Dashboard - Liquid Glass</p>
<nav class="nav">
<button class="active" data-tab="orders" onclick="showTab('orders',this)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
Pesanan <span class="badge" id="badgePending">0</span></button>
<button data-tab="history" onclick="showTab('history',this)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
History Harian</button>
<button data-tab="setoran" onclick="showTab('setoran',this)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
Setoran</button>
<button data-tab="stok" onclick="showTab('stok',this)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
Stok Produk</button>
<button data-tab="users" onclick="showTab('users',this)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
Data User</button>
<button data-tab="ratings" onclick="showTab('ratings',this)">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
Rating</button>
</nav>
<div class="side-foot"><b>Setoran Hari Ini</b><br><span id="sideToday" style="font-size:18px;font-weight:800;color:#7c3aed">Rp0</span><br><span id="sideTodayCount" style="font-size:12px;color:#4b5563">0 pesanan</span></div>
</aside>
<div class="main">
<div id="loginBox" class="glass" style="max-width:400px;margin:60px auto;text-align:center">
<h2>Login Admin</h2><p style="font-size:13px;color:#4b5563;margin:8px 0">Password: ramdanasya</p>
<input type="password" id="adminPass" placeholder="Password Admin">
<button class="btn" onclick="adminLogin()">Masuk Admin</button>
<button class="btn btn-ghost" onclick="window.location.href='index.html'">Kembali ke Toko</button>
</div>
<div id="adminPanel" style="display:none">
<div class="topbar">
<button class="hamburger" onclick="toggleSide()">&#9776;</button>
<div><h2 style="font-size:20px">Dashboard</h2><p style="font-size:12px;color:#4b5563">Admin RansVelt Store</p></div>
<button onclick="window.location.href='index.html'" style="padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.5);backdrop-filter:blur(10px);color:#111;font-weight:700;display:flex;align-items:center;gap:6px">Lihat Toko <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg></button>
</div>
<div class="stat-grid-4">
<div class="glass"><b id="totalToday" style="font-size:22px">Rp0</b><br><span style="font-size:12px;color:#4b5563">Hari Ini</span></div>
<div class="glass"><b id="totalYesterday" style="font-size:22px">Rp0</b><br><span style="font-size:12px;color:#4b5563">Kemarin</span></div>
<div class="glass"><b id="totalWeek" style="font-size:22px">Rp0</b><br><span style="font-size:12px;color:#4b5563">7 Hari Terakhir</span></div>
<div class="glass"><b id="totalOmzet" style="font-size:22px">Rp0</b><br><span style="font-size:12px;color:#4b5563">Total Omzet</span></div>
</div>
<div id="tab-orders" style="margin-top:14px"></div>
<div id="tab-history" style="display:none;margin-top:14px"></div>
<div id="tab-setoran" style="display:none;margin-top:14px"></div>
<div id="tab-stok" style="display:none;margin-top:14px"></div>
<div id="tab-users" style="display:none;margin-top:14px"></div>
<div id="tab-ratings" style="display:none;margin-top:14px"></div>
</div>
</div>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let STOCK = {};
let ALL_ORDERS = [];
const NAMES = {
'tele-id':'Nokos Tele ID','tele-my':'Nokos Tele MY','tele-vn':'Nokos Tele VN','tele-us':'Nokos Tele US',
'wa-id':'Nokos WA ID','wa-ph':'Nokos WA PH','wa-jp':'Nokos WA JP',
'tt-follow':'TT Followers','tt-like':'TT Like','tt-view':'TT View',
'ig-follow':'IG Followers','ig-like':'IG Like','ig-view':'IG View',
'web-gmail':'Web Gmail','web-porto':'Web Porto'
};
function fmt(n){ return 'Rp'+(n||0).toLocaleString('id-ID'); }
function toast(m){ let t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); }
function toggleSide(force){
let s=document.getElementById('sidebar'); let o=document.getElementById('overlay');
let show = force!==undefined?force:!s.classList.contains('show');
s.classList.toggle('show',show); o.classList.toggle('show',show);
}
function adminLogin(){
let p=document.getElementById('adminPass').value;
if(p!==ADMIN_PASSWORD) return alert('Password salah!');
document.getElementById('loginBox').style.display='none';
document.getElementById('adminPanel').style.display='block';
loadAll();
}
function showTab(id,btn){
['orders','history','setoran','stok','users','ratings'].forEach(k=>document.getElementById('tab-'+k).style.display='none');
document.getElementById('tab-'+id).style.display='block';
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(window.innerWidth<768) toggleSide(false);
}
function dateKey(ts){
let d=new Date(ts);
return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function labelDate(key){
let today=dateKey(Date.now());
let y=new Date(); y.setDate(y.getDate()-1); let yKey=dateKey(y.getTime());
if(key===today) return 'Hari Ini';
if(key===yKey) return 'Kemarin';
let d=new Date(key+'T00:00:00');
return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function loadAll(){ loadOrders(); loadStock(); loadUsers(); loadRatings(); }
function loadOrders(){
db.ref('orders').on('value',snap=>{
let data=snap.val()||{};
ALL_ORDERS=Object.values(data).sort((a,b)=>b.createdAt-a.createdAt);
let todayKey=dateKey(Date.now());
let y=new Date(); y.setDate(y.getDate()-1); let yKey=dateKey(y.getTime());
let weekStart=Date.now()-7*24*60*60*1000;
let sumToday=ALL_ORDERS.filter(o=>dateKey(o.createdAt)===todayKey).reduce((s,o)=>s+(o.total||0),0);
let sumY=ALL_ORDERS.filter(o=>dateKey(o.createdAt)===yKey).reduce((s,o)=>s+(o.total||0),0);
let sumWeek=ALL_ORDERS.filter(o=>o.createdAt>=weekStart).reduce((s,o)=>s+(o.total||0),0);
let omzet=ALL_ORDERS.filter(o=>o.status==='Selesai').reduce((s,o)=>s+(o.total||0),0);
let pending=ALL_ORDERS.filter(o=>o.status==='Pending').length;
let countToday=ALL_ORDERS.filter(o=>dateKey(o.createdAt)===todayKey).length;
document.getElementById('totalToday').innerText=fmt(sumToday);
document.getElementById('totalYesterday').innerText=fmt(sumY);
document.getElementById('totalWeek').innerText=fmt(sumWeek);
document.getElementById('totalOmzet').innerText=fmt(omzet);
document.getElementById('badgePending').innerText=pending;
document.getElementById('sideToday').innerText=fmt(sumToday);
document.getElementById('sideTodayCount').innerText=countToday+' pesanan hari ini';

// TAB PESANAN
document.getElementById('tab-orders').innerHTML=ALL_ORDERS.length?ALL_ORDERS.map(o=>`
<div class="order-card">
<b>${o.product}</b> - <span class="status ${o.status}">${o.status}</span><br>
<small>${o.id} | ${new Date(o.createdAt).toLocaleString('id-ID')}</small><br>
User: <b>${o.userName||'-'}</b> | WA: <b>${o.wa||'-'}</b><br>
Qty: ${o.qty} | Link: ${o.link||'-'}<br>
<b>Total: ${fmt(o.total)}</b><br>
${o.note?'<small>Note: '+o.note+'</small><br>':''}
<select id="st-${o.id}">
<option ${o.status==='Pending'?'selected':''}>Pending</option>
<option ${o.status==='Proses'?'selected':''}>Proses</option>
<option ${o.status==='Selesai'?'selected':''}>Selesai</option>
</select>
<input id="nt-${o.id}" placeholder="Catatan buat customer (misal: nomornya...)" value="${o.note||''}">
<button class="btn btn-green" onclick="updateOrder('${o.id}')">Update Status</button>
<button class="btn btn-red" onclick="deleteOrder('${o.id}')">Hapus Pesanan</button>
</div>`).join(''):'Belum ada pesanan.';

// TAB HISTORY HARIAN
let grouped={};
ALL_ORDERS.forEach(o=>{ let k=dateKey(o.createdAt); if(!grouped[k]) grouped[k]={list:[],total:0,selesai:0}; grouped[k].list.push(o); grouped[k].total+=o.total||0; if(o.status==='Selesai') grouped[k].selesai+=o.total||0; });
let keys=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
let maxTotal=Math.max(1,...keys.map(k=>grouped[k].total));
let historyHtml='<div class="glass"><h3>History Harian</h3><p style="font-size:12px;color:#4b5563;margin:6px 0">Lihat pemasukan per hari. Klik tanggal untuk lihat detail pesanan hari itu.</p>';
historyHtml+='<label>Filter Tanggal</label><input type="date" id="filterDate" onchange="renderHistory()"><button class="btn btn-ghost" onclick="clearDateFilter()">Tampilkan Semua Hari</button><div id="historyList" style="margin-top:12px"></div></div>';
document.getElementById('tab-history').innerHTML=historyHtml;
window._grouped=grouped; window._keys=keys; window._maxTotal=maxTotal;
renderHistory();

// TAB SETORAN - Produk, Harga, Jumlah, WA
let setoranHtml='<div class="glass"><h3>Setoran - Semua Pesanan</h3><p style="font-size:12px;color:#4b5563;margin:6px 0">Total Omzet Selesai: <b>'+fmt(omzet)+'</b> | Total Semua: <b>'+fmt(ALL_ORDERS.reduce((s,o)=>s+(o.total||0),0))+'</b></p>';
setoranHtml+='<label>Filter Status</label><select id="filterSetoran" onchange="renderSetoran()"><option value="ALL">Semua Status</option><option value="Selesai">Selesai Saja</option><option value="Pending">Pending Saja</option><option value="Proses">Proses Saja</option></select><div id="setoranList"></div></div>';
document.getElementById('tab-setoran').innerHTML=setoranHtml;
renderSetoran();
});
}
function clearDateFilter(){ document.getElementById('filterDate').value=''; renderHistory(); }
function renderHistory(){
let grouped=window._grouped||{}; let keys=window._keys||[]; let maxTotal=window._maxTotal||1;
let f=document.getElementById('filterDate')?document.getElementById('filterDate').value:'';
if(f) keys=keys.filter(k=>k===f);
if(!keys.length){ document.getElementById('historyList').innerHTML='Tidak ada data di tanggal itu.'; return; }
document.getElementById('historyList').innerHTML=keys.map(k=>{
let g=grouped[k]; let pct=Math.round(g.total/maxTotal*100);
let isToday=k===dateKey(Date.now());
return `<div class="history-day ${isToday?'active-day':''}">
<div style="display:flex;justify-content:space-between;gap:10px"><div><b>${labelDate(k)}</b><br><small>${k} | ${g.list.length} pesanan | Selesai: ${fmt(g.selesai)}</small></div><div style="text-align:right"><b style="font-size:18px;color:#7c3aed">${fmt(g.total)}</b><br><small>Total hari itu</small></div></div>
<div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
<div style="margin-top:10px">${g.list.map(o=>`<div class="setoran-row"><div><b>${o.product}</b><br><small>${new Date(o.createdAt).toLocaleTimeString('id-ID')} | ${o.id}</small><br><span class="status ${o.status}">${o.status}</span></div><div style="text-align:right"><b>${fmt(o.total)}</b><br><small>Jumlah: ${o.qty}</small><br><small>WA: ${o.wa||'-'}</small></div></div>`).join('')}</div>
</div>`;
}).join('');
}
function renderSetoran(){
let f=document.getElementById('filterSetoran')?document.getElementById('filterSetoran').value:'ALL';
let list=ALL_ORDERS.filter(o=>f==='ALL'||o.status===f);
let total=list.reduce((s,o)=>s+(o.total||0),0);
document.getElementById('setoranList').innerHTML='<p style="margin:10px 0"><b>Total Filter Ini: '+fmt(total)+' | '+list.length+' pesanan</b></p>' + (list.length?list.map(o=>`
<div class="setoran-row">
<div><b>${o.product}</b><br><small>${new Date(o.createdAt).toLocaleString('id-ID')} | ${o.id}</small><br><span class="status ${o.status}">${o.status}</span></div>
<div style="text-align:right"><b>${fmt(o.total)}</b><br><small>Jumlah: ${o.qty}</small><br><small>WA: ${o.wa||'-'}</small></div>
</div>`).join(''):'Belum ada setoran.');
}
function updateOrder(id){
let st=document.getElementById('st-'+id).value;
let note=document.getElementById('nt-'+id).value;
db.ref('orders/'+id).update({status:st,note:note}).then(()=>toast('Pesanan di-update'));
}
function deleteOrder(id){ if(confirm('Hapus pesanan ini?')) db.ref('orders/'+id).remove(); }
function loadStock(){
db.ref('settings/stock').on('value',snap=>{
STOCK=snap.val()||{};
document.getElementById('tab-stok').innerHTML='<div class="glass"><h3>Atur Stok Produk</h3><p style="font-size:12px;color:#4b5563">0 = CLOSED. Kosongin = stok tak terbatas.</p>'+Object.keys(NAMES).map(k=>`
<label>${NAMES[k]} (${k})</label>
<input type="number" id="stock-${k}" value="${STOCK[k]!==undefined?STOCK[k]:''}" placeholder="Kosong = unlimited">
`).join('')+'<button class="btn" onclick="saveStock()">Simpan Semua Stok</button></div>';
});
}
function saveStock(){
let obj={};
Object.keys(NAMES).forEach(k=>{
let v=document.getElementById('stock-'+k).value;
if(v!==''&&v!==null) obj[k]=parseInt(v);
});
db.ref('settings/stock').set(obj).then(()=>toast('Stok disimpan'));
}
function loadUsers(){
db.ref('users').on('value',snap=>{
let data=snap.val()||{}; let list=Object.values(data);
document.getElementById('tab-users').innerHTML=list.length?list.map(u=>`<div class="glass" style="margin-bottom:10px"><b>@${u.username}</b><br>Email: ${u.email}<br>WA: ${u.wa}<br><button class="btn btn-red" onclick="deleteUser('${u.username}')">Hapus User</button></div>`).join(''):'Belum ada user.';
});
}
function deleteUser(u){ if(confirm('Hapus user @'+u+'?')) db.ref('users/'+u).remove(); }
function loadRatings(){
db.ref('ratings').on('value',snap=>{
let data=snap.val()||{}; let list=Object.values(data).sort((a,b)=>b.createdAt-a.createdAt);
document.getElementById('tab-ratings').innerHTML=list.length?list.map(r=>`<div class="glass" style="margin-bottom:10px"><b>${r.userName}</b> - ${'★'.repeat(r.stars)}<br><small>${r.product}</small><p>${r.text||''}</p>${r.photo?'<img src="'+r.photo+'" style="width:100%;border-radius:12px">':''}</div>`).join(''):'Belum ada rating.';
});
}
</script>
</body>
  </html>
